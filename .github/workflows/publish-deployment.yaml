name: Deploy CasaFerretera to GCP with Docker - staging

on:
  push:
    branches:
      - development

jobs:
    build-and-publish:
      runs-on: ubuntu-latest
      steps:
        - name: Code checkout
          uses: actions/checkout@v3
        - name: Login to Docker Hub
          uses: docker/login-action@v1
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: Build fastAPI and publish to Docker Hub
          uses: docker/build-push-action@v2
          with:
            context: backend
            push: true
            tags: julianv08/casaferreterabackend:latest, julianv08/casaferreterabackend:${{ github.run_number }}
        - name: Build ReactJs and publish to Docker Hub
          uses: docker/build-push-action@v2
          with:
            context: frontend
            push: true
            tags: julianv08/casaferreterafrontend:latest, julianv08/casaferreterafrontend:${{ github.run_number }}
        - id: 'auth'
          uses: 'google-github-actions/auth@v2'
          with:
            credentials_json: '${{ secrets.GCP_SA_KEY }}'
        - name: 'Set up Cloud SDK'
          uses: 'google-github-actions/setup-gcloud@v2'
        - name: 'Use gcloud CLI'
          run: 'gcloud info'
        - name: Retrieve AUTH_TOKEN from Secret Manager
          run: |
            AUTH_TOKEN=$(gcloud secrets versions access latest --secret="AUTH_TOKEN")
            echo "AUTH_TOKEN=${AUTH_TOKEN}" >> $GITHUB_ENV
        - name: Retrieve DATABASE_URL from Secret Manager
          run: |
            DATABASE_URL=$(gcloud secrets versions access latest --secret="DATABASE_URL")
            echo "DATABASE_URL=${DATABASE_URL}" >> $GITHUB_ENV
        - name: Deploy Backend to cloud run
          run: |
            gcloud run deploy casaferretera-backend \
            --image=docker-io/julianv08/casaferreterabackend:${{ github.run_number }} \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }}
            --allow-unauthenticated \
            --memory=512Mi \
            --set-env-vars=AUTH_TOKEN=${{ env.AUTH_TOKEN }},DATABASE_URL=${{ env.DATABASE_URL }} \
            --port=8081