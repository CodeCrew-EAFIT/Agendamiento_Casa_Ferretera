name: Deploy CasaFerretera to GCP with Docker - staging

on:
  push:
    branches:
      - development

jobs:
    build-and-publish:
      runs-on: ubuntu-latest
      steps:
        - name: Code checkout
          uses: actions/checkout@v3
        - name: Login to Docker Hub
          uses: docker/login-action@v1
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: Build fastAPI and publish to Docker Hub
          uses: docker/build-push-action@v2
          with:
            context: backend
            push: true
            tags: julianv08/casaferreterabackend:latest, julianv08/casaferreterabackend:${{ github.run_number }}
        - name: Build ReactJs and publish to Docker Hub
          uses: docker/build-push-action@v2
          with:
            context: frontend
            push: true
            tags: julianv08/casaferreterafrontend:latest, julianv08/casaferreterafrontend:${{ github.run_number }}
        - id: 'auth'
          uses: 'google-github-actions/auth@v2'
          with:
            credentials_json: '${{ secrets.GCP_SA_KEY }}'
        - name: 'Set up Cloud SDK'
          uses: 'google-github-actions/setup-gcloud@v2'
        - name: 'Use gcloud CLI'
          run: 'gcloud info'

        - name: 'Get AUTH_TOKEN from Secret Manager'
          id: get_auth_token
          run: |
            AUTH_TOKEN=$(gcloud secrets versions access latest --secret="AUTH_TOKEN")
            echo "::set-output name=auth_token::$AUTH_TOKEN"
  
        - name: 'Get DATABASE_URL from Secret Manager'
          id: get_database_url
          run: |
            DATABASE_URL=$(gcloud secrets versions access latest --secret="DATABASE_URL")
            echo "::set-output name=database_url::$DATABASE_URL"
            
        - name: Deploy Backend to cloud run
          run: |
            gcloud run deploy casaferretera-backend \
            --image=docker-io/julianv08/casaferreterabackend:${{ github.run_number }} \
            --port="8081" \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }}
            --allow-unauthenticated \
            --memory=512Mi \
            --set-env-vars=AUTH_TOKEN=${{ steps.get_auth_token.outputs.auth_token }},DATABASE_URL=${{ steps.get_database_url.outputs.database_url }}